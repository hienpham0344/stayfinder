spring:
  config:
    import: optional:file:.env[.properties]

  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false

  application:
    name: stayfinder

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Supabase transaction pooling cannot retain named server prepared statements.
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:}
    auth:
      localhost-insecure-cookie: ${AUTH_LOCALHOST_INSECURE_COOKIE:false}

  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}




stayfinder:
  payment:
    demo-usd-vnd-rate: ${DEMO_USD_VND_RATE:25000}
    demo-rate-version: ${DEMO_RATE_VERSION:demo-v1}
  demo-operations:
    enabled: ${DEMO_OPERATIONS_ENABLED:false}
